name: dietitian_panel
description: Diyetisyenlik App dietitian management panel (Flutter Web only).
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  supabase_flutter: ^2.17.2
  core:
    path: ../../packages/core
  # Web-only panel (locked decision §2.3 #38); used for localStorage so a
  # reload cannot wipe an interview.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
