name: core
description: Shared models, config, and theme for the client app and the dietitian panel.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
