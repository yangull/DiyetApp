name: core
description: Shared models, config, and theme for the client app and the dietitian panel.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    # The variable file (wght 100-900), unmodified as its licence requires;
    # Flutter maps FontWeight onto its wght axis.
    - family: Alpino
      fonts:
        - asset: fonts/Alpino-Variable.ttf
    # Only for the plan PDF: the pdf package cannot read a variable font.
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
